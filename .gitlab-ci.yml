stages:
    - build

build:
    image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    stage: build
    script:
        - dotnet restore
        - dotnet publish -c Release -o ./output -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
    artifacts:
        paths:
            - output/
        expire_in: 1 week
    

